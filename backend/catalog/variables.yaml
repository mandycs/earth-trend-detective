# Variable catalog for the sweep.
#
# role:
#   driver  -> climate variable; used as a regressor in the residual analysis
#   impact  -> land/water variable; tested for trend and for its non-climate residual
# applies_to: site tags where the variable makes sense (a site gets every variable
#   whose applies_to intersects its tags; "any" matches every site)
# drivers: for impact variables, the climate drivers used in the residual regression
# scale/offset: raw_value * scale + offset = value in `units`

variables:
  # --- Climate drivers (NASA POWER, no auth) ---
  - id: t2m
    label: Air temperature
    role: driver
    source: power
    dataset: NASA POWER (MERRA-2)
    band: T2M
    units: "°C"
    scale: 1.0
    offset: 0.0
    temporal: monthly
    tags: [climate, temperature]
    applies_to: [any]
    drivers: []

  - id: precip
    label: Rainfall
    role: driver
    source: power
    dataset: NASA POWER (MERRA-2 + IMERG corrected)
    band: PRECTOTCORR
    units: "mm/day"
    scale: 1.0
    offset: 0.0
    temporal: monthly
    tags: [climate, water]
    applies_to: [any]
    drivers: []

  - id: solar
    label: Sunlight at the surface
    role: driver
    source: power
    dataset: NASA POWER (CERES SYN1deg)
    band: ALLSKY_SFC_SW_DWN
    units: "MJ/m²/day"
    scale: 1.0
    offset: 0.0
    temporal: monthly
    tags: [climate, energy]
    applies_to: [any]
    drivers: []

  # --- Impact variables (MODIS via AppEEARS, Earthdata Login) ---
  - id: ndvi
    label: Plant greenness
    role: impact
    source: appeears
    dataset: MOD13A3.061
    band: _1_km_monthly_NDVI
    units: "NDVI"
    scale: 0.0001
    offset: 0.0
    temporal: monthly
    tags: [vegetation, land]
    applies_to: [vegetated, wetland, forest, agriculture]
    drivers: [precip, t2m, solar]

  - id: lst_day
    label: Daytime ground temperature
    role: impact
    source: appeears
    dataset: MOD11A2.061
    band: LST_Day_1km
    units: "°C"
    scale: 0.02
    offset: -273.15
    temporal: 8-day
    tags: [temperature, land]
    applies_to: [any]
    drivers: [t2m, solar]

  - id: et
    label: Water evaporated by land and plants
    role: impact
    source: appeears
    dataset: MOD16A2GF.061
    band: ET_500m
    units: "kg/m²/8day"
    scale: 0.1
    offset: 0.0
    temporal: 8-day
    tags: [water, vegetation]
    applies_to: [vegetated, wetland, forest, agriculture]
    drivers: [precip, t2m, solar]

  - id: snow_cover
    label: Snow cover
    role: impact
    source: appeears
    dataset: MOD10A1.061
    band: NDSI_Snow_Cover
    units: "%"
    scale: 1.0
    offset: 0.0
    temporal: daily
    # Monthly value computed pixel-wise from the MOD10A1 NetCDF: values > 100
    # (cloud/night/water flags, 255 fill) masked per pixel before averaging; mean over
    # valid pixel-days; NaN if < 20% valid. Stats CSV only as fallback (no NetCDF).
    tags: [snow, ice]
    applies_to: [snow, glacier, mountain]
    drivers: [t2m, precip]

  # --- Impact variables (GLDAS Noah monthly via Earthdata Cloud OPeNDAP, Earthdata Login) ---
  # Hydrology Data Rods and on-prem GES DISC OPeNDAP are retired (HTTP 410).
  - id: soil_moisture
    label: Topsoil moisture
    role: impact
    source: gldas
    dataset: GLDAS_NOAH025_M.2.1
    band: SoilMoi0_10cm_inst
    units: "kg/m²"            # water in the top 10 cm (1 kg/m² = 1 mm); monthly mean
    scale: 1.0
    offset: 0.0
    temporal: monthly
    tags: [water, soil]
    applies_to: [any]
    drivers: [precip, t2m]

  - id: runoff
    label: Surface runoff
    role: impact
    source: gldas
    dataset: GLDAS_NOAH025_M.2.1
    band: Qs_acc
    units: "mm/day"
    scale: 8.0                # monthly file = mean 3-hourly accumulation (kg/m²/3h); x8 -> mm/day
    offset: 0.0
    temporal: monthly
    tags: [water]
    applies_to: [any]
    drivers: [precip]

  # --- Impact variables (GRACE/GRACE-FO mascons, Earthdata Login) ---
  - id: grace_tws
    label: Total water stored
    role: impact
    source: grace
    dataset: TELLUS_GRAC-GRFO_MASCON_CRI_GRID_RL06.3_V4
    band: lwe_thickness
    units: "cm"
    scale: 1.0
    offset: 0.0
    temporal: monthly
    tags: [water, groundwater]
    applies_to: [any]
    drivers: [precip, t2m]

  # --- Impact variables (MODIS MOD09A1 open water via AppEEARS, Earthdata Login) ---
  # Own AppEEARS task per site (`<site>_water` in tasks.json); see app/extractors/water.py.
  - id: water_area
    label: Open-water area
    role: impact
    source: appeears_water
    dataset: MOD09A1.061
    band: "NDWI(sur_refl_b04, sur_refl_b02) > 0, clear sky (sur_refl_state_500m)"
    units: "km²"
    scale: 1.0
    offset: 0.0
    temporal: 8-day
    tags: [water, reservoir]
    applies_to: [water_body]
    drivers: [precip, t2m]

  # --- Extra climate drivers, selected per site in sites.yaml (NOT by tags: applies_to: []) ---
  # Only used as candidate regressors in the residual model selection (stats/residual.py);
  # no impact lists them in `drivers`, so their absence never skips a residual.
  # They are trend-tested and listed like the other drivers in the sweep.
  - id: t2m_upstream
    label: Air temperature upstream
    role: driver
    source: power
    dataset: NASA POWER (MERRA-2), mean of the site's upstream_climate points
    band: T2M
    units: "°C"
    scale: 1.0
    offset: 0.0
    temporal: monthly
    tags: [climate, temperature, upstream]
    applies_to: []
    drivers: []

  - id: precip_upstream
    label: Rainfall and snowfall upstream
    role: driver
    source: power
    dataset: NASA POWER (MERRA-2 + IMERG corrected), mean of the site's upstream_climate points
    band: PRECTOTCORR
    units: "mm/day"
    scale: 1.0
    offset: 0.0
    temporal: monthly
    tags: [climate, water, upstream]
    applies_to: []
    drivers: []

  - id: degree_days
    label: Melt warmth (degree-days)
    role: driver
    source: power
    dataset: NASA POWER (MERRA-2), derived from monthly T2M as max(T2M, 0) x days in month
    band: T2M
    units: "°C·day"
    scale: 1.0
    offset: 0.0
    temporal: monthly
    tags: [climate, snow, temperature]
    applies_to: []
    drivers: []

  - id: winter_precip
    label: Winter snowfall and rain so far
    role: driver
    source: power
    dataset: NASA POWER (MERRA-2 + IMERG corrected), derived from monthly PRECTOTCORR as Oct-Apr water-year total
    band: PRECTOTCORR
    units: "mm"
    scale: 1.0
    offset: 0.0
    temporal: monthly
    tags: [climate, snow, water]
    applies_to: []
    drivers: []
