# Variable catalog for the sweep.
#
# role:
#   driver  -> climate variable; used as a regressor in the residual analysis
#   impact  -> land/water variable; tested for trend and for its non-climate residual
# applies_to: site tags where the variable makes sense (a site gets every variable
#   whose applies_to intersects its tags; "any" matches every site)
# drivers: for impact variables, the climate drivers used in the residual regression
# scale/offset: raw_value * scale + offset = value in `units`

variables:
  # --- Climate drivers (NASA POWER, no auth) ---
  - id: t2m
    label: Air temperature
    definition: "How warm the air near the ground is, averaged over each month, estimated by a NASA global weather model."
    role: driver
    source: power
    dataset: NASA POWER (MERRA-2)
    band: T2M
    units: "°C"
    scale: 1.0
    offset: 0.0
    temporal: monthly
    tags: [climate, temperature]
    applies_to: [any]
    drivers: []

  - id: precip
    label: Rainfall
    definition: "How much water falls from the sky each day, as rain or snow, averaged over each month, from NASA satellites and weather models."
    role: driver
    source: power
    dataset: NASA POWER (MERRA-2 + IMERG corrected)
    band: PRECTOTCORR
    units: "mm/day"
    scale: 1.0
    offset: 0.0
    temporal: monthly
    tags: [climate, water]
    applies_to: [any]
    drivers: []

  - id: solar
    label: Sunlight at the surface
    definition: "How much sunlight reaches the ground each day, averaged over each month, estimated from NASA satellite measurements."
    role: driver
    source: power
    dataset: NASA POWER (CERES SYN1deg)
    band: ALLSKY_SFC_SW_DWN
    units: "MJ/m²/day"
    scale: 1.0
    offset: 0.0
    temporal: monthly
    tags: [climate, energy]
    applies_to: [any]
    drivers: []

  # --- Impact variables (MODIS via AppEEARS, Earthdata Login) ---
  - id: ndvi
    label: Plant greenness
    definition: "How green and leafy the land looks from space, read from the colors a satellite sees; higher means healthier plant growth."
    role: impact
    source: appeears
    dataset: MOD13A3.061
    band: _1_km_monthly_NDVI
    units: "NDVI"
    scale: 0.0001
    offset: 0.0
    temporal: monthly
    tags: [vegetation, land]
    applies_to: [vegetated, wetland, forest, agriculture]
    drivers: [precip, t2m, solar]

  - id: lst_day
    label: Daytime ground temperature
    definition: "How hot the ground surface itself is in the daytime, seen from space by a NASA satellite. It is not the air temperature."
    role: impact
    source: appeears
    dataset: MOD11A2.061
    band: LST_Day_1km
    units: "°C"
    scale: 0.02
    offset: -273.15
    temporal: 8-day
    tags: [temperature, land]
    applies_to: [any]
    drivers: [t2m, solar]

  - id: et
    label: Water evaporated by land and plants
    definition: "How much water rises from the soil and from plant leaves back into the air, estimated from satellite data every few days."
    role: impact
    source: appeears
    dataset: MOD16A2GF.061
    band: ET_500m
    units: "kg/m²/8day"
    scale: 0.1
    offset: 0.0
    temporal: 8-day
    tags: [water, vegetation]
    applies_to: [vegetated, wetland, forest, agriculture]
    drivers: [precip, t2m, solar]

  - id: snow_cover
    label: Snow cover
    definition: "The share of an area covered by snow, averaged over each month and seen from space by a NASA satellite."
    role: impact
    source: appeears
    dataset: MOD10A1.061
    band: NDSI_Snow_Cover
    units: "%"
    scale: 1.0
    offset: 0.0
    temporal: daily
    # Monthly value computed pixel-wise from the MOD10A1 NetCDF: values > 100
    # (cloud/night/water flags, 255 fill) masked per pixel before averaging; mean over
    # valid pixel-days; NaN if < 20% valid. Stats CSV only as fallback (no NetCDF).
    tags: [snow, ice]
    applies_to: [snow, glacier, mountain]
    drivers: [t2m, precip]

  # --- Yearly values at any point (MODIS monthly layers on NASA GIBS, no auth) ---
  # Off-case twins of the AppEEARS variables above (app/extractors/gibs_values.py):
  # dataset = GIBS layer; every month of a year read back from the GIBS colormap (interval
  # midpoints), averaged, then the box mean. One value per year: trend-tested on the annual
  # path only; drivers as the twin's, but no climate split on yearly values (it needs months).
  # Status "observed", precision one palette step.
  - id: ndvi_gibs
    label: Plant greenness (yearly values)
    definition: "How green and leafy the land looks from space, averaged over each year from NASA's MODIS satellite pictures; higher means more plant growth."
    role: impact
    source: gibs
    dataset: MODIS_Terra_L3_NDVI_Monthly   # MOD13A3, colormap MODIS_L3_NDVI
    band: MODIS_L3_NDVI
    units: "NDVI"
    scale: 1.0
    offset: 0.0
    temporal: annual
    resolution: "~1 km"
    tags: [vegetation, land]
    applies_to: [vegetated, wetland, forest, agriculture]
    drivers: [precip, t2m, solar]

  - id: lst_gibs
    label: Daytime ground temperature (yearly values)
    definition: "How hot the ground surface itself is in the daytime, averaged over each year from NASA's MODIS satellite pictures. It is not the air temperature."
    role: impact
    source: gibs
    dataset: MODIS_Terra_L3_Land_Surface_Temp_Monthly_Day   # MOD11C3, colormap MODIS_Land_Surface_Temp
    band: MODIS_Land_Surface_Temp
    units: "°C"
    scale: 1.0
    offset: 0.0
    temporal: annual
    resolution: "~5.6 km"
    tags: [temperature, land]
    applies_to: [any]
    drivers: [t2m, solar]

  - id: snow_gibs
    label: Snow cover (yearly values)
    definition: "The share of the ground covered by snow, averaged over each year from NASA's MODIS satellite pictures."
    role: impact
    source: gibs
    dataset: MODIS_Terra_L3_Snow_Cover_Monthly_Average_Pct   # MOD10CM, colormap MODIS_NDSI_Snow_Cover
    band: MODIS_NDSI_Snow_Cover
    units: "%"
    scale: 1.0
    offset: 0.0
    temporal: annual
    resolution: "~5.6 km"
    tags: [snow, ice]
    applies_to: [snow, glacier, mountain]
    drivers: [t2m, precip]

  # --- Impact variables (GLDAS Noah monthly via Earthdata Cloud OPeNDAP, Earthdata Login) ---
  # Hydrology Data Rods and on-prem GES DISC OPeNDAP are retired (HTTP 410).
  - id: soil_moisture
    label: Topsoil moisture
    definition: "How much water is held in the top layer of soil, estimated by a NASA land model and averaged over each month."
    role: impact
    source: gldas
    dataset: GLDAS_NOAH025_M.2.1
    band: SoilMoi0_10cm_inst
    units: "kg/m²"            # water in the top 10 cm (1 kg/m² = 1 mm); monthly mean
    scale: 1.0
    offset: 0.0
    temporal: monthly
    tags: [water, soil]
    applies_to: [any]
    drivers: [precip, t2m]

  - id: runoff
    label: Surface runoff
    definition: "How much rain or melted snow flows over the land into rivers and lakes instead of soaking into the ground, from a NASA land model."
    role: impact
    source: gldas
    dataset: GLDAS_NOAH025_M.2.1
    band: Qs_acc
    units: "mm/day"
    scale: 8.0                # monthly file = mean 3-hourly accumulation (kg/m²/3h); x8 -> mm/day
    offset: 0.0
    temporal: monthly
    tags: [water]
    applies_to: [any]
    drivers: [precip]

  # --- Impact variables (GRACE/GRACE-FO mascons, Earthdata Login) ---
  - id: grace_tws
    label: Total water stored
    definition: "All the water stored in a region — underground, in the soil, in snow and in lakes — weighed from space by the GRACE satellites."
    role: impact
    source: grace
    dataset: TELLUS_GRAC-GRFO_MASCON_CRI_GRID_RL06.3_V4
    band: lwe_thickness
    units: "cm"
    scale: 1.0
    offset: 0.0
    temporal: monthly
    tags: [water, groundwater]
    applies_to: [any]
    drivers: [precip, t2m]

  # --- Impact variables (MODIS MOD09A1 open water via AppEEARS, Earthdata Login) ---
  # Own AppEEARS task per site (`<site>_water` in tasks.json); see app/extractors/water.py.
  - id: water_area
    label: Open-water area
    definition: "The area of a lake or reservoir covered by open water, in square kilometres, seen from space every few days when the sky is clear."
    role: impact
    source: appeears_water
    dataset: MOD09A1.061
    band: "NDWI(sur_refl_b04, sur_refl_b02) > 0, clear sky (sur_refl_state_500m)"
    units: "km²"
    scale: 1.0
    offset: 0.0
    temporal: 8-day
    tags: [water, reservoir]
    applies_to: [water_body]
    drivers: [precip, t2m]

  # --- Extra climate drivers, selected per site in sites.yaml (NOT by tags: applies_to: []) ---
  # Only used as candidate regressors in the residual model selection (stats/residual.py);
  # no impact lists them in `drivers`, so their absence never skips a residual.
  # They are trend-tested and listed like the other drivers in the sweep.
  - id: t2m_upstream
    label: Air temperature upstream
    definition: "Air temperature from a NASA weather model, averaged over several points upstream of the site, where the water that reaches it comes from."
    role: driver
    source: power
    dataset: NASA POWER (MERRA-2), mean of the site's upstream_climate points
    band: T2M
    units: "°C"
    scale: 1.0
    offset: 0.0
    temporal: monthly
    tags: [climate, temperature, upstream]
    applies_to: []
    drivers: []

  - id: precip_upstream
    label: Rainfall and snowfall upstream
    definition: "Rain and snow from a NASA weather model, averaged over several points upstream of the site, where the water that reaches it comes from."
    role: driver
    source: power
    dataset: NASA POWER (MERRA-2 + IMERG corrected), mean of the site's upstream_climate points
    band: PRECTOTCORR
    units: "mm/day"
    scale: 1.0
    offset: 0.0
    temporal: monthly
    tags: [climate, water, upstream]
    applies_to: []
    drivers: []

  - id: degree_days
    label: Melt warmth (degree-days)
    definition: "A warmth-for-melting score: the month's average air temperature, counted only when it is above freezing, times the days in the month."
    role: driver
    source: power
    dataset: NASA POWER (MERRA-2), derived from monthly T2M as max(T2M, 0) x days in month
    band: T2M
    units: "°C·day"
    scale: 1.0
    offset: 0.0
    temporal: monthly
    tags: [climate, snow, temperature]
    applies_to: []
    drivers: []

  - id: winter_precip
    label: Winter snowfall and rain so far
    definition: "Rain and snow added up through the October-to-April season, when snow builds up in mountains; the total restarts each October."
    role: driver
    source: power
    dataset: NASA POWER (MERRA-2 + IMERG corrected), derived from monthly PRECTOTCORR as Oct-Apr water-year total
    band: PRECTOTCORR
    units: "mm"
    scale: 1.0
    offset: 0.0
    temporal: monthly
    tags: [climate, snow, water]
    applies_to: []
    drivers: []

  # --- Sea variables (NOAA CoastWatch ERDDAP griddap, no auth; app/extractors/erddap.py) ---
  # dataset = ERDDAP dataset id, band = ERDDAP variable. One request per year, sequential.
  # Dataset ids checked live on 2026-11-15 with the ERDDAP search:
  #   coastwatch.pfeg.noaa.gov/erddap/search/index.csv?searchFor=chlorophyll+aqua+monthly
  #   coastwatch.noaa.gov/erddap/search/index.csv?searchFor=degree+heating
  - id: sst
    label: Sea surface temperature
    definition: "How warm the top of the sea is, averaged over each month, from NASA JPL's MUR map built from several satellites."
    role: driver
    source: erddap
    dataset: jplMURSST41mday    # NASA JPL MUR SST (GHRSST L4) monthly: the primary SST product
    band: sst
    units: "°C"
    scale: 1.0
    offset: 0.0
    temporal: monthly
    resolution: "~1 km"
    tags: [climate, temperature, sea]
    applies_to: [ocean, coast, reef]
    drivers: []

  - id: chlorophyll
    label: Chlorophyll in the sea (log10)
    definition: "How much green algae colours the sea, from NASA's MODIS Aqua satellite; shown as a log10 value, so +1 means ten times more."
    role: impact
    source: erddap
    # query "chlorophyll aqua monthly": erdMH1chlamday_R2022SQ = MODIS Aqua L3SMI 4 km, R2022
    # science quality, monthly composite. Trend on log10 (transform); clipped to the study period.
    dataset: erdMH1chlamday_R2022SQ
    band: chlor_a
    units: "log10(mg/m³)"
    scale: 1.0
    offset: 0.0
    transform: log10
    temporal: monthly
    resolution: "~4 km"
    tags: [sea, water_quality]
    applies_to: [ocean, coast, reef]
    drivers: [sst, precip, solar]

  # Heat stress: yearly maximum of NOAA Coral Reef Watch daily degree heating weeks at the
  # point over the warm half of the year (January-June south of the equator, July-December
  # north; query "degree heating" -> noaacrwdhwDaily, the only match; NOAA_DHW_monthly has no
  # DHW). One value per year: trend-tested on the annual path only, offered on reefs.
  - id: dhw
    label: Heat stress on corals (degree heating weeks, NOAA, not NASA)
    definition: "How much heat has built up in the sea over the last 12 weeks, the yearly peak from NOAA Coral Reef Watch; 4 or more stresses corals."
    role: driver
    source: erddap
    dataset: noaacrwdhwDaily
    band: degree_heating_week
    units: "°C-weeks"
    scale: 1.0
    offset: 0.0
    temporal: annual
    resolution: "~5 km"
    tags: [sea, temperature, heat_stress]
    applies_to: [reef]
    drivers: []
